# Kōki: il cervello (Worker + Durable Object) e la pagina 3D (cartella public).
name = "koki"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Indirizzo pubblico koki.<nome>.workers.dev sempre acceso
workers_dev = true

# La pagina 3D e i suoi file.
[assets]
directory = "./public"

# Il cervello gratuito di Cloudflare.
[ai]
binding = "AI"

# La "casa" di Kōki: un Durable Object con database SQLite.
[[durable_objects.bindings]]
name = "KOKI"
class_name = "Koki"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Koki"]

# Sveglia di riserva: se per qualche motivo il ciclo si ferma, lo riavvia.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Modello di Workers AI (deve supportare la modalità JSON).
MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
# Modello grande e più fantasioso: lo usano il Mondo narratore e, ogni tanto, Kōki quando decide.
BIG_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Massimo di chiamate al giorno: modello piccolo e modello grande (oltre, Kōki va "a inerzia" con le regole).
MAX_AI_CALLS = "150"
MAX_BIG_CALLS = "40"
# I disegni veri: modello di immagini e quanti al giorno al massimo.
IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
MAX_IMAGES = "4"
# Ogni quanti minuti Kōki vive un turno.
TICK_MINUTES = "5"
# Dove sta l'isola nel mondo reale: ora e meteo di Milano.
TIMEZONE = "Europe/Rome"
LAT = "45.46"
LON = "9.19"
# La password (PASSWORD) si imposta come "Secret" dalla dashboard di Cloudflare, non qui.
